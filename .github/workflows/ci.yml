name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: '10.0.402'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NUGET_SIGNATURE_VERIFICATION: 'true'

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow hardening rules
        run: |
          python3 -m venv "${RUNNER_TEMP}/wfcheck-venv"
          "${RUNNER_TEMP}/wfcheck-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes --no-deps --only-binary=:all: -r scripts/workflow-check/requirements.txt
          "${RUNNER_TEMP}/wfcheck-venv/bin/python" -B -I scripts/workflow-check/test_check_workflows.py -v
          "${RUNNER_TEMP}/wfcheck-venv/bin/python" -B -I scripts/workflow-check/check_workflows.py .github/workflows

      - name: Set up .NET SDK (isolated install, exact version)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Assert resolved SDK version
        run: |
          actual="$(dotnet --version)"
          echo "Resolved SDK: ${actual}"
          if [ "${actual}" != "${DOTNET_SDK_VERSION}" ]; then
            echo "::error::Resolved SDK ${actual} differs from pinned ${DOTNET_SDK_VERSION}; lock files would fail with NU1004."
            exit 1
          fi

      - name: Point NuGet at a job-local package folder
        run: echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget-packages" >> "${GITHUB_ENV}"

      - name: Restore NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ github.workflow }}-sdk-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', 'global.json', 'src/DecisionGateway.Host/DecisionGateway.Host.csproj') }}

      - name: Assert clean working tree after cache restore
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::Cache restore changed the working tree."
            exit 1
          fi

      - name: Restore (locked mode, NuGet audit as errors)
        run: >-
          dotnet restore DecisionGateway.slnx --locked-mode -tl:off
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          -p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Assert lock files unchanged
        run: |
          git diff --exit-code -- '*packages.lock.json'
          if [ -n "$(git status --porcelain -- '*packages.lock.json')" ]; then
            git status --porcelain -- '*packages.lock.json'
            echo "::error::Restore created or modified packages.lock.json files."
            exit 1
          fi

      - name: Verify NuGet package signatures
        run: |
          mapfile -d '' -t pkgs < <(find "${NUGET_PACKAGES}" -name '*.nupkg' -print0 | sort -z)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::No packages found in ${NUGET_PACKAGES}."
            exit 1
          fi
          missing=0
          while IFS= read -r -d '' meta; do
            dir="$(dirname "${meta}")"
            if ! compgen -G "${dir}/*.nupkg" > /dev/null; then
              echo "::error::Package folder without its .nupkg: ${dir#"${NUGET_PACKAGES}/"}"
              missing=1
            fi
          done < <(find "${NUGET_PACKAGES}" -name '.nupkg.metadata' -print0)
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          if ! dotnet nuget verify --all "${pkgs[@]}" > /dev/null; then
            for pkg in "${pkgs[@]}"; do
              if ! dotnet nuget verify --all "${pkg}" > /dev/null; then
                echo "::error::Signature verification failed: ${pkg#"${NUGET_PACKAGES}/"}"
                dotnet nuget verify --all "${pkg}" || true
              fi
            done
            exit 1
          fi
          echo "Verified signatures of ${#pkgs[@]} packages."

      - name: Save NuGet package cache
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build DecisionGateway.slnx -c Release --no-restore -tl:off

      - name: Test with coverage
        run: >-
          dotnet test DecisionGateway.slnx -c Release --no-build -tl:off
          --filter "Category!=Contract&Category!=ProviderContract&Category!=Startup&Category!=Overhead&Category!=Security"
          --collect "Code Coverage;Format=cobertura"
          --logger trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/test-results/**/*.trx
            ${{ runner.temp }}/test-results/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  publish-aot:
    name: publish-aot (${{ matrix.rid }})
    needs: build-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    env:
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK (isolated install, exact version)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Assert resolved SDK version
        run: |
          actual="$(dotnet --version)"
          echo "Resolved SDK: ${actual}"
          if [ "${actual}" != "${DOTNET_SDK_VERSION}" ]; then
            echo "::error::Resolved SDK ${actual} differs from pinned ${DOTNET_SDK_VERSION}; lock files would fail with NU1004."
            exit 1
          fi

      - name: Point NuGet at a job-local package folder
        run: echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget-packages" >> "${GITHUB_ENV}"

      - name: Ensure native toolchain (Linux)
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 10
        run: |
          missing=()
          command -v clang > /dev/null 2>&1 || missing+=("clang")
          dpkg -s zlib1g-dev > /dev/null 2>&1 || missing+=("zlib1g-dev")
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          clang --version

      - name: Restore (locked mode)
        run: dotnet restore src/DecisionGateway.Host/DecisionGateway.Host.csproj --locked-mode -tl:off

      - name: Verify NuGet package signatures
        run: |
          count="$(find "${NUGET_PACKAGES}" -name '*.nupkg' | wc -l | tr -d ' ')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No packages found in ${NUGET_PACKAGES}."
            exit 1
          fi
          missing=0
          while IFS= read -r -d '' meta; do
            dir="$(dirname "${meta}")"
            if ! compgen -G "${dir}/*.nupkg" > /dev/null; then
              echo "::error::Package folder without its .nupkg: ${dir#"${NUGET_PACKAGES}/"}"
              missing=1
            fi
          done < <(find "${NUGET_PACKAGES}" -name '.nupkg.metadata' -print0)
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          failed=0
          while IFS= read -r -d '' pkg; do
            if ! dotnet nuget verify --all "${pkg}" > /dev/null; then
              echo "::error::Signature verification failed: ${pkg#"${NUGET_PACKAGES}/"}"
              dotnet nuget verify --all "${pkg}" || true
              failed=1
            fi
          done < <(find "${NUGET_PACKAGES}" -name '*.nupkg' -print0 | sort -z)
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Verified signatures of ${count} packages."

      - name: Publish Native AOT
        run: |
          out="${RUNNER_TEMP}/publish/${RID}"
          dotnet publish src/DecisionGateway.Host/DecisionGateway.Host.csproj \
            -c Release -r "${RID}" -o "${out}" -tl:off \
            --no-restore \
            -p:TreatWarningsAsErrors=true \
            -p:TrimmerSingleWarn=false \
            2>&1 | tee "${RUNNER_TEMP}/publish-${RID}.log"

      - name: Assert no IL2xxx/IL3xxx diagnostics
        run: |
          if grep -En '(warning|error) IL[23][0-9]{3}' "${RUNNER_TEMP}/publish-${RID}.log"; then
            echo "::error::IL2xxx/IL3xxx diagnostics in Native AOT publish for ${RID}."
            exit 1
          fi

      - name: Assert lock files unchanged
        run: |
          git diff --exit-code -- '*packages.lock.json'
          if [ -n "$(git status --porcelain -- '*packages.lock.json')" ]; then
            git status --porcelain -- '*packages.lock.json'
            echo "::error::Publish restore created or modified packages.lock.json files."
            exit 1
          fi

      - name: Stage native file
        run: |
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          src="${RUNNER_TEMP}/publish/${RID}/decision-gateway-mcp${ext}"
          if [ ! -s "${src}" ]; then
            echo "::error::Native file not found or empty: ${src}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/artifact"
          cp "${src}" "${RUNNER_TEMP}/artifact/decision-gateway-mcp-${RID}${ext}"

      - name: Upload native file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-gateway-mcp-${{ matrix.rid }}
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          retention-days: 14

  # Stage 0: the startup time is measured and reported only; no threshold fails this job.
  # The job fails only when a measurement cannot be taken. Tests of category Startup do not
  # run in CI (build-test excludes them); this job is the end-to-end proof of the harness.
  startup-perf:
    name: startup-perf (${{ matrix.rid }})
    needs: publish-aot
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    env:
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK (isolated install, exact version)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Assert resolved SDK version
        run: |
          actual="$(dotnet --version)"
          echo "Resolved SDK: ${actual}"
          if [ "${actual}" != "${DOTNET_SDK_VERSION}" ]; then
            echo "::error::Resolved SDK ${actual} differs from pinned ${DOTNET_SDK_VERSION}; lock files would fail with NU1004."
            exit 1
          fi

      - name: Point NuGet at a job-local package folder
        run: |
          echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget-packages" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/nuget-packages"

      - name: Download native file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decision-gateway-mcp-${{ matrix.rid }}
          path: ${{ runner.temp }}/native

      - name: Restore harness (locked mode)
        run: dotnet restore bench/DecisionGateway.StartupHarness/DecisionGateway.StartupHarness.csproj --locked-mode -tl:off

      - name: Build harness
        run: dotnet build bench/DecisionGateway.StartupHarness/DecisionGateway.StartupHarness.csproj -c Release --no-restore -tl:off

      - name: Assert no packages and lock files unchanged
        run: |
          if [ -n "$(find "${NUGET_PACKAGES}" -mindepth 1 | head -n 1)" ]; then
            find "${NUGET_PACKAGES}" -mindepth 1 -maxdepth 2
            echo "::error::The harness restore fetched packages; they would run without signature verification."
            exit 1
          fi
          git diff --exit-code -- '*packages.lock.json'
          if [ -n "$(git status --porcelain -- '*packages.lock.json')" ]; then
            git status --porcelain -- '*packages.lock.json'
            echo "::error::Harness restore created or modified packages.lock.json files."
            exit 1
          fi

      - name: Measure startup (50 runs, stage 0 — report only)
        run: |
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          bin="${RUNNER_TEMP}/native/decision-gateway-mcp-${RID}${ext}"
          if [ ! -s "${bin}" ]; then
            echo "::error::Native file not found or empty: ${bin}"
            exit 1
          fi
          if [ "${RUNNER_OS}" != "Windows" ]; then chmod +x "${bin}"; fi
          mkdir -p "${RUNNER_TEMP}/startup"
          dotnet bench/DecisionGateway.StartupHarness/bin/Release/net10.0/DecisionGateway.StartupHarness.dll \
            --binary "${bin}" --runs 50 --rid "${RID}" \
            --output "${RUNNER_TEMP}/startup/startup-${RID}.json" \
            | tee "${RUNNER_TEMP}/startup-${RID}.log"
          summary="$(grep -E '^summary: ' "${RUNNER_TEMP}/startup-${RID}.log" | tail -n 1)"
          {
            echo "### startup-perf ${RID} (stage 0, no threshold)"
            echo ""
            echo "\`${summary#summary: }\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload startup report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-${{ matrix.rid }}
          path: ${{ runner.temp }}/startup/startup-${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 14
