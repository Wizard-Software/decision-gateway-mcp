name: shape

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NOLOGO: '1'

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show
        run: |
          echo "plain script"
          echo "uses: not-an-action@v1"

      - name: Folded
        run: >-
          echo folded
          && echo script

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: README.md
